image_width: 1280
image_height: 720
sensor_width_mm: 23.76
sensor_height_mm: 13.365
object_plane_z_cm: 300.0
# cam1 совпадает с CineCameraActor1. cam3 — та же поза, но ролик на 360
# кадров впереди общих часов. cam2 и cam4 смотрят мимо пути на 100 м и
# больше. У cam5 луч попадает в путь, но в обратном ходе: это другой проезд.
cameras:
  cam1:
    video: configs/cam1.mp4
    calibration: configs/calibration/object_transform_CineCameraActor1.csv
    focal_mm: 35.0
  cam2:
    enabled: false
    video: configs/cam2.mp4
    calibration: configs/calibration/object_transform_CineCameraActor2.csv
    focal_mm: 60.0
  cam3:
    frame_offset: 360
    video: configs/cam3.mp4
    calibration: configs/calibration/object_transform_CineCameraActor3.csv
    focal_mm: 35.0
  cam4:
    enabled: false
    video: configs/cam4.mp4
    calibration: configs/calibration/object_transform_CineCameraActor4.csv
    focal_mm: 50.0
  cam5:
    enabled: false
    video: configs/cam5.mp4
    calibration: configs/calibration/object_transform_CineCameraActor5.csv
    focal_mm: 20.0
